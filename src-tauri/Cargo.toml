[package]
name = "rustmusic"
version = "0.1.8"
description = "RustMusic - 精美的高性能音乐播放器"
authors = ["RustMusic"]
license = "Apache-2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rodio = { version = "0.20", features = ["symphonia-mp3", "symphonia-aac", "symphonia-isomp4", "symphonia-vorbis", "symphonia-wav", "flac"] }
lofty = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
rayon = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
ureq = { version = "2", features = ["json"] }
percent-encoding = "2"
souvlaki = "0.8"
parking_lot = "0.12"
base64 = "0.22"
aes = "0.8"
regex = "1"
flate2 = "1"
md-5 = "0.10"
sha1 = "0.10"
hex = "0.4"
num-bigint = "0.4"
rand = "0.8"
qrcode = { version = "0.14", default-features = false, features = ["image"] }
filetime = "0.2"

[target.'cfg(windows)'.dependencies]
# WebView2 TrySuspend：托盘隐藏时挂起渲染进程回收内存
webview2-com = "0.38"
windows = "0.61"

[profile.release]
lto = true
strip = true
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
