name: Release

# 打 tag（v0.7.3 之类）时在云端构建 macOS（Apple Silicon / Intel）与 Linux arm64
# 安装包并上传到草稿 Release，不自动转正；Windows x64 与 Linux x64 仍由本地 /
# 虚拟机打包并离线签名后手动补齐并发布。
# 手动触发（workflow_dispatch）只构建、保留 artifact，不碰 Release。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      notes_file: ${{ steps.notes.outputs.file }}
      exists: ${{ steps.guard.outputs.exists }}
    steps:
      - uses: actions/checkout@v4

      # 手动重跑已发布的 tag 时不要回退成草稿：已有正式 Release 就整条流水线跳过
      - id: guard
        name: 检查 Release 是否已正式发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          published=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json isDraft --jq '.isDraft' 2>/dev/null || echo "missing")
          if [ "$published" = "false" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "该 tag 已有正式 Release，跳过本次构建"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - id: notes
        name: 查找该版本的发布说明
        run: |
          f="installer/release-notes-${GITHUB_REF_NAME}.md"
          if [ -f "$f" ]; then
            echo "file=$f" >> "$GITHUB_OUTPUT"
          else
            echo "file=" >> "$GITHUB_OUTPUT"
          fi

      # 始终保持草稿状态：等本地打包的 Windows x64 / Linux x64 安装包与签名
      # 补齐后，由维护者在 Release 页面核对无误再手动转正
      - name: 创建草稿 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES_FILE: ${{ steps.notes.outputs.file }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release 已存在，跳过创建"
            exit 0
          fi
          if [ -n "$NOTES_FILE" ]; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --title "RustMusic $GITHUB_REF_NAME" --notes-file "$NOTES_FILE"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --title "RustMusic $GITHUB_REF_NAME" --generate-notes
          fi

  build:
    needs: prepare
    # prepare 被跳过时（手动触发）也照常构建；已有正式 Release 时跳过
    if: |
      always() &&
      needs.prepare.outputs.exists != 'true' &&
      (needs.prepare.result == 'success' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64 与 Linux x64 保留本地 / 虚拟机打包与离线签名；
          # 云端仅补齐本机缺少环境的 Linux arm64 与 macOS 双架构。
          # 公共仓库的 ubuntu-24.04-arm 是原生 arm64，免交叉编译
          - os: ubuntu-24.04-arm
            label: linux-arm64
          # macos-latest 是 Apple Silicon；Intel 用显式标签
          - os: macos-latest
            label: macos-arm64
          - os: macos-15-intel
            label: macos-x64
    name: build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libdbus-1-dev \
            libasound2-dev patchelf

      - name: 安装前端依赖
        run: npm ci

      - name: 构建安装包
        env:
          # CI 容器内无 FUSE 设备时免挂载直接运行 linuxdeploy/appimagetool
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm run tauri build

      - name: 收集产物
        shell: bash
        run: |
          mkdir -p dist-release
          case "${{ runner.os }}" in
            Linux)
              # 签名私钥（installer/signing.key）始终离线保管，不在 CI 签名；
              # 如需为 arm64 AppImage 提供应用内更新，可下载后在本机补签 .sig
              cp src-tauri/target/release/bundle/appimage/*.AppImage dist-release/
              cp src-tauri/target/release/bundle/deb/*.deb dist-release/
              ;;
            macOS)
              # macOS 暂不支持应用内自动更新，只产 dmg 供手动安装
              cp src-tauri/target/release/bundle/dmg/*.dmg dist-release/
              ;;
          esac
          ls -lh dist-release

      - name: 上传到草稿 Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist-release/* \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: 保留构建产物
        uses: actions/upload-artifact@v4
        with:
          name: rustmusic-${{ matrix.label }}
          path: dist-release/*
          if-no-files-found: error
