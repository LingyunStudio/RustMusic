name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 先构建前端（tauri 上下文引用 dist），再跑 Rust 单测
      - name: 前端类型检查 + 构建
        run: |
          npm ci
          npm run build

      - name: Rust 单元测试
        working-directory: src-tauri
        run: cargo test --bin rustmusic
